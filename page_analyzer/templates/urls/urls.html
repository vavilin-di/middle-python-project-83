{% extends 'common/common_template.html' %}
{% block content %}
  <h1>Сайты</h1>
  {% if urls %}
    <table data-test="urls" class="table table-bordered table-striped">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Имя</th>
          <th scope="col">Последняя проверка</th>
          <th scope="col">Код ответа</th>
        </tr>
      </thead>
      <tbody>
        {% for url in urls %}
          <tr>
            <td>{{ loop.index }}</td>
            <td>
              <a href="{{ url.name }}">{{ url.name }}</a>
            </td>
            <td>{{ url.last_check }}</td>
            <td>{{ url.status_code }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
